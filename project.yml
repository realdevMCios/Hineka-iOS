name: Hineka
options:
  bundleIdPrefix: com.realdevmcios
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  HinekaUI:
    path: .
targets:
  Hineka:
    type: application
    platform: iOS
    sources:
      - path: App/Hineka/HinekaApp.swift
    dependencies:
      - package: HinekaUI
        product: HinekaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realdevmcios.hineka
        PRODUCT_NAME: Hineka
        INFOPLIST_KEY_CFBundleDisplayName: Hineka
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
      testTargets: []

name: Experimental iOS Zero JVM

on:
  workflow_dispatch:

jobs:
  build-openjdk-zero-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out Hineka
        uses: actions/checkout@v4

      - name: Set up boot JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Install OpenJDK build prerequisites
        run: brew install autoconf

      - name: Build OpenJDK Mobile Zero for iOS ARM64
        run: bash Scripts/build-openjdk-ios-zero.sh

      - name: Upload exploratory JVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hineka-openjdk-ios-arm64-zero
          path: artifacts/openjdk-ios-zero/
          if-no-files-found: error
          retention-days: 7

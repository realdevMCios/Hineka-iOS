name: Hineka iOS source build

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Package.swift"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "App/**"
      - "Package.swift"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build HinekaUI for iOS Simulator
        run: >-
          xcodebuild
          -scheme HinekaUI
          -destination 'generic/platform=iOS Simulator'
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

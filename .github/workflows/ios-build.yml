name: Hineka iOS source build

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "App/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: hineka-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    timeout-minutes: 35
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Swift package manifest
        run: swift package dump-package

      - name: Parse all Swift source files
        run: |
          while IFS= read -r -d '' source; do
            echo "Parsing ${source}"
            swiftc -frontend -parse "${source}"
          done < <(find App -type f -name '*.swift' -print0)

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Hineka app for iOS Simulator
        run: >-
          xcodebuild
          -project Hineka.xcodeproj
          -scheme Hineka
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

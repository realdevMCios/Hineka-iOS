name: Hineka iOS source build

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Scripts/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "App/**"
      - "Scripts/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: hineka-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-device:
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 26 for the smoke-test JAR
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Prepare pinned OpenJDK Mobile runtime inputs
        run: bash Scripts/prepare-openjdk-ios-runtime.sh

      - name: Validate Swift package manifest and resolve dependencies
        run: |
          swift package dump-package
          swift package resolve

      - name: Parse all Swift source files
        run: |
          while IFS= read -r -d '' source; do
            echo "Parsing ${source}"
            swiftc -frontend -parse "${source}"
          done < <(find App -type f -name '*.swift' -print0)

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Hineka for generic iOS device (unsigned)
        run: >-
          xcodebuild
          -project Hineka.xcodeproj
          -scheme Hineka
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
